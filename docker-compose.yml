version: '3.8'

services:
  novapay_postgres:
    image: postgres:15
    container_name: novapay_postgres
    environment:
      POSTGRES_DB: novapay_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - novapay_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  novapay_postgres_data: